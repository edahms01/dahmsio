[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # vite@8 / @vitejs/plugin-react@6 require Node ^20.19.0 || >=22.12.0.
  NODE_VERSION = "22"

# Pings IndexNow with the sitemap's URLs after every successful production deploy. See
# netlify/plugins/indexnow/index.js — best-effort, never fails the build.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

# Vite content-hashes everything under /assets/ (JS, CSS, fonts) — a filename only ever
# changes when its content does, so these are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root-level static files (favicons, manifest, OG image) aren't content-hashed, so they get a
# shorter cache instead of "immutable" — a same-named replacement should still show up within
# a day rather than being stuck behind a year-long cache.
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
