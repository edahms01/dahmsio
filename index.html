<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050e13" />

    <!--
      Per-page title, description, canonical, and og:title/og:description/og:url are set at
      build time by each route's <PageMeta> (see src/components/PageMeta.jsx), sourced from
      that page's META object in src/data/*.js. Only genuinely site-wide tags live here —
      og:image is identical on every page since there's no per-page image yet.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DahmsIO" />
    <meta property="og:image" content="https://dahms.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dahms.io/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static shim so Netlify's build-time crawler can detect this form and its fields.
      The real form is rendered by React on the /contact route; this one is never shown.
      https://docs.netlify.com/manage/forms/setup/#javascript-rendered-forms
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="companyName" />
      <input type="text" name="website" />
      <input type="text" name="location" />
      <input type="text" name="services" />
      <input type="text" name="budget" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
